<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brevwick — vanilla static example</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }
      button {
        padding: 0.75rem 1.25rem;
        font-size: 1rem;
        border-radius: 0.5rem;
        border: 1px solid currentColor;
        background: transparent;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #result {
        margin-top: 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }
      .ok {
        color: #0a7f2e;
      }
      .err {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Brevwick — vanilla static example</h1>
      <p>
        No build step. The SDK loads as ESM straight from
        <code>esm.sh</code>. Click the button to submit a hard-coded issue.
      </p>
      <button id="send" type="button">Send feedback</button>
      <div id="result" aria-live="polite"></div>
    </main>

    <!--
      Replace `pk_test_replace_me` below with your own test key from
      brevwick.dev → project → Keys. The CDN URL is pinned to a specific
      version so this no-build example never silently shifts under you;
      bump the pin when you upgrade.
    -->
    <script type="module">
      import { createBrevwick } from 'https://esm.sh/@tatlacas/brevwick-sdk@1.0.0-beta.7';

      // Replace this with a real key before running. `createBrevwick`
      // validates synchronously, so we short-circuit on the seeded
      // placeholder to render a friendly message instead of throwing.
      const PROJECT_KEY = 'pk_test_replace_me';
      const PLACEHOLDER_KEY = 'pk_test_replace_me';

      const button = document.getElementById('send');
      const result = document.getElementById('result');

      if (PROJECT_KEY === PLACEHOLDER_KEY) {
        button.disabled = true;
        result.className = 'err';
        result.textContent =
          'Replace pk_test_replace_me in this file with a real test key from brevwick.dev → project → Keys.';
      } else {
        const brevwick = createBrevwick({
          projectKey: PROJECT_KEY,
          environment: 'dev',
        });

        button.addEventListener('click', async () => {
          button.disabled = true;
          result.className = '';
          result.textContent = 'Sending…';
          try {
            const res = await brevwick.submit({
              title: 'Hello from the vanilla static example',
              description: 'Test issue',
            });
            if (res.ok) {
              result.className = 'ok';
              result.textContent = `Issue sent: ${res.issue_id}`;
            } else {
              result.className = 'err';
              result.textContent = `Error [${res.error.code}]: ${res.error.message}`;
            }
          } catch (err) {
            result.className = 'err';
            result.textContent = `Unexpected error: ${String(err)}`;
          } finally {
            button.disabled = false;
          }
        });
      }
    </script>
  </body>
</html>
