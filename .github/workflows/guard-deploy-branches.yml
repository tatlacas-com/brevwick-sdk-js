name: Guard deploy branches

on:
  pull_request:
    branches: [main]

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Only allow merges from chore/promote-* or changeset-release/main
        if: |
          github.head_ref != 'changeset-release/main' &&
          !startsWith(github.head_ref, 'chore/promote-')
        run: |
          echo "::error::Only 'chore/promote-*' or 'changeset-release/main' branches can be merged into 'main'. Got '${{ github.head_ref }}'. Direct 'dev → main' is blocked because dev is in changesets pre mode and main is not — use scripts/promote-stable.sh, which exits pre mode on the chore branch before opening the PR."
          exit 1
