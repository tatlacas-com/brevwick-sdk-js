name: Guard deploy branches

on:
  pull_request:
    branches: [main]

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Only allow merges from dev, chore/promote-*, or changeset-release/main
        if: |
          github.head_ref != 'dev' &&
          github.head_ref != 'changeset-release/main' &&
          !startsWith(github.head_ref, 'chore/promote-')
        run: |
          echo "::error::Only 'dev', 'chore/promote-*', or 'changeset-release/main' branches can be merged into 'main'. Got '${{ github.head_ref }}'. Use scripts/promote-stable.sh to open a promotion PR."
          exit 1
